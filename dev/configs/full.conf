server {
    listen 127.0.0.1:8080;
    server_name example.com www.example.com;
    client_max_body_size 10m;
    error_page 404 500 /errors/404.html;

    location / {
        alias dev/html/;
        index index.html index.htm;
    }

    location /uploads/ {
        alias dev/var/www/uploads/;
        client_max_body_size 25m;
    }

    location /old/ {
        return 301 /new;
    }
}
