server {
    listen 127.0.0.1:8080;
    server_name errors.test;
    root html;

    # single code -> its own page
    error_page 404 /errors/404.html;

    # many codes -> one shared page (multi-code form)
    error_page 400 405 411 413 414 /errors/client.html;
    error_page 500 501 502 503 504 505 /errors/server.html;

    location / {
        index index.html;
    }

    # location-level error_page must win over the server-level 404 above.
    #   curl http://127.0.0.1:8080/override/anything -> errors/location_404.html
    location /override {
        error_page 404 /errors/location_404.html;
    }

    #   curl http://127.0.0.1:8080/broken/anything -> default error body
    location /broken {
        error_page 404 /errors/missing.html;
    }
}

# plain server without error_page directive, just to diff against server above
server {
    listen 127.0.0.1:8081;
    server_name plain.test;
    root html;

    location / {
        index index.html;
    }
}
