# Two server blocks, exercising per-address binding and the "*" wildcard form.
# The first block is loopback-only; the second is reachable on all interfaces.

server {
    listen 127.0.0.1:8080;
    listen 8081;
    root html;
    location / {
        index index.html;
    }
}

server {
    listen 8083;
    listen *:8084;
    root html;

    location / {
        index alt_index.html;
    }
}
