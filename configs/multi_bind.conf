# Two server blocks, exercising per-address binding and the "*" wildcard form.
# The first block is loopback-only; the second is reachable on all interfaces.

server {
    listen 127.0.0.1:8080;
    server_name first.local;

    location / {
        alias /var/www/first;
        index index.html;
    }
}

server {
    listen 8083;
    listen *:8084;
    server_name second.local;

    location / {
        alias /var/www/second;
        index index.html;
    }
}
