server {
	listen 0.0.0.0:8080;
	server_name localhost;
	root html;

	location / {
        index index.html;
    }

	location /test {
		alias html/cgi;
		index index.html;

		# cgi .py /usr/bin/python3;
		# cgi .php /usr/bin/php;
    	
        error_page 404 /errors/location_404.html;
		error_page 500 501 502 503 504 505 /errors/server.html;
	}
}
