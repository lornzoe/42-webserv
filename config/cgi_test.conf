# =============================================================================
# webserv — CGI-focused test configuration
# =============================================================================
# Run with: ./webserv config/cgi_test.conf
#
# This config focuses on exercising CGI features on port 9090.
# Only one server block, with several CGI-enabled locations.
# =============================================================================

server {
    listen      0.0.0.0:9090;
    server_name cgi-test;
    root        www/html;
    index       index.html;
    client_max_body_size 5M;

    error_page  404 /errors/404.html;
    error_page  500 /errors/500.html;

    # ------------------------------------------------------------------
    # Root: serve static files, no CGI
    # ------------------------------------------------------------------
    location / {
        methods     GET;
        autoindex   off;
    }

    # ------------------------------------------------------------------
    # Python CGI via .py extension
    # cgi_path points to the python3 interpreter.
    # Any file ending in .py inside www/cgi-bin/ will be executed.
    # ------------------------------------------------------------------
    location /cgi-bin {
        methods         GET POST;
        root            www/cgi-bin;
        cgi_extension   .py;
        cgi_path        /usr/bin/python3;
    }

    # ------------------------------------------------------------------
    # Upload with directory listing
    # POST saves files; GET shows the listing.
    # ------------------------------------------------------------------
    location /upload {
        methods     POST DELETE;
        root        www/html;
        upload_dir  www/uploads;
    }

    location /files {
        methods     GET;
        root        www/uploads;
        autoindex   on;
    }
}
