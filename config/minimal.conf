# =============================================================================
# webserv — Minimal configuration (single server, port 8080)
# =============================================================================
# The simplest possible configuration:
#   - One server on port 8080
#   - Serves static files from www/html
#   - No CGI, no upload
#
# Use this as a starting point when debugging basic HTTP behaviour.
# Run with: ./webserv config/minimal.conf
# =============================================================================

server {
    listen  0.0.0.0:8080;
    root    www/html;
    index   index.html;
    client_max_body_size 1M;

    location / {
        methods     GET;
        autoindex   off;
    }

    location /files {
        methods     GET;
        root        www/html;
        autoindex   on;
    }
}
