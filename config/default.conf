# =============================================================================
# webserv — Default Configuration File
# =============================================================================
#
# FORMAT OVERVIEW
# ---------------
# This file uses an NGINX-inspired syntax.
# Everything after '#' on a line is a comment.
#
# Top level: one or more `server { }` blocks.
# Inside a server block: directives and `location { }` blocks.
#
# DIRECTIVES
# ----------
# listen          host:port  — IP address and port to bind
#                              (use 0.0.0.0 to bind all interfaces)
# server_name     name       — optional name for virtual hosting
# root            path       — filesystem root for serving files
# index           filename   — default file when URI points to a directory
# client_max_body_size  size — max allowed body; suffix K = kilobytes, M = megabytes
# error_page      code path  — custom HTML error page (relative to root)
#
# LOCATION DIRECTIVES (inside a location block)
# ---------------------------------------------
# methods         METHOD...  — allowed HTTP methods; default: all
# root            path       — override root for this location
# index           file       — override default index file
# autoindex       on|off     — directory listing (default: off)
# upload_dir      path       — directory where uploaded files are saved (POST)
# return          [code] url — HTTP redirect (code defaults to 301)
# cgi_extension   .ext       — file extension that triggers CGI execution
# cgi_path        /bin/prog  — path to the CGI interpreter
#
# =============================================================================


# -----------------------------------------------------------------------------
# Server block 1 — primary web server on port 8080
# -----------------------------------------------------------------------------
server {
    listen      0.0.0.0:8080;
    server_name localhost;

    # Serve files from www/html/ by default
    root        www/html;
    index       index.html;

    # Reject bodies larger than 10 MB
    client_max_body_size 10M;

    # Custom error pages (files relative to root)
    error_page  404 /errors/404.html;
    error_page  500 /errors/500.html;

    # ------------------------------------------------------------------
    # Location: /
    # Serves static files from www/html. GET and POST allowed.
    # autoindex is off so a missing index.html gives 403, not a listing.
    # ------------------------------------------------------------------
    location / {
        methods     GET POST;
        autoindex   off;
    }

    # ------------------------------------------------------------------
    # Location: /files
    # Directory listing enabled — browse uploaded files.
    # ------------------------------------------------------------------
    location /files {
        methods     GET;
        root        www/uploads;
        autoindex   on;
    }

    # ------------------------------------------------------------------
    # Location: /upload
    # Clients can POST files here; they land in www/uploads/.
    # ------------------------------------------------------------------
    location /upload {
        methods     POST DELETE;
        root        www/html;
        upload_dir  www/uploads;
    }

    # ------------------------------------------------------------------
    # Location: /cgi-bin
    # Execute Python scripts (.py) via python3.
    # The CGI script gets the full request via environment variables
    # and stdin; it writes its response (headers + body) to stdout.
    # ------------------------------------------------------------------
    location /cgi-bin {
        methods         GET POST;
        root            www/cgi-bin;
        cgi_extension   .py;
        cgi_path        /usr/bin/python3;
    }

    # ------------------------------------------------------------------
    # Location: /old-page
    # Demonstrates HTTP redirection. Visiting /old-page redirects the
    # browser permanently (301) to /index.html.
    # ------------------------------------------------------------------
    location /old-page {
        return  301 /index.html;
    }
}


# -----------------------------------------------------------------------------
# Server block 2 — second server on port 8081
# Demonstrates that webserv can listen on multiple ports simultaneously.
# -----------------------------------------------------------------------------
server {
    listen      0.0.0.0:8081;
    server_name localhost;
    root        www/html;
    index       index.html;
    client_max_body_size 1M;

    location / {
        methods     GET;
        autoindex   on;
    }
}
