# Run from the repo root: ./webserv showcase/full.conf

# Site A: same site on two interface:port pairs
server {
    listen 0.0.0.0:8080;
    listen 127.0.0.1:8081;
    server_name showcase.local;
    root showcase/www;
    index index.html;
    client_max_body_size 10m;

    error_page 404 /errors/404.html;
    error_page 400 403 405 408 413 415 /errors/4xx.html;
    error_page 500 502 504 /errors/50x.html;

    cgi .py /usr/bin/python3;
    cgi .pl /usr/bin/perl;

    location / {
        limit_except GET POST DELETE;
    }

    # routing
    location /files/ {
        autoindex on;
        limit_except GET;
    }
    location /noindex/ {
        autoindex off;
    }
    location /multi-index/ {
        index index.html home.htm;
    }
    location /gallery/ {
        alias showcase/www/static/;
        autoindex on;
        limit_except GET;
    }
    location /docs/ {
        root showcase/www/files;
        autoindex on;
        limit_except GET;
    }
    location /readonly/ {
        limit_except GET;
        autoindex on;
    }
    location /private/ {
        error_page 404 /errors/location_404.html;
    }

    # uploads
    location /storage/ {
        upload_store showcase/www/storage;
        autoindex on;
        client_max_body_size 20m;
        limit_except GET POST DELETE;
    }
    location /tiny-upload/ {
        upload_store showcase/www/storage;
        client_max_body_size 1k;
        limit_except POST;
    }

    # body size limit
    location /limits/ {
        client_max_body_size 100;
        limit_except GET POST;
    }

    # sessions (bonus)
    location /profile/ {
        alias showcase/www/;
        index profile.html;
        limit_except GET POST;
    }
    location /profile_pics/ {
        limit_except GET;
    }

    # redirects & return
    location /old/ {
        return 301 /;
    }
    location /temp/ {
        return 302 /files/;
    }
    location /see-other/ {
        return 303 /profile/;
    }
    location /keep-method/ {
        return 307 /cgi/echo.py;
    }
    location /moved-for-good/ {
        return 308 /cgi/echo.py;
    }
    location /nginx/ {
        return 301 https://nginx.org/;
    }
    location /health/ {
        return 200 "OK - webserv is alive";
    }
    location /gone/ {
        return 404;
    }
}

# Site B: different port and content, no error_page (built-in defaults)
server {
    listen 0.0.0.0:8082;
    root showcase/www-b;
    client_max_body_size 1k;

    location / {
        limit_except GET;
    }
    location /api/ {
        return 200 "Hello from site B";
    }
}
