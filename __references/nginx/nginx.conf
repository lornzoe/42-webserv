# Reference nginx config for comparing against webserv.
#
# Run it from the project root, INSIDE the webserv dev container:
#   ./__references/nginx/nginx.sh start      # or stop / reload / test
#
# It listens on :8084 (a forwarded port) so it runs alongside webserv (:8080).
# The document root is the project's ./html directory, so both servers
# serve the exact same files. All paths are relative to the project root
# and self-contained (mime.types is vendored next to this file).

worker_processes  1;
error_log         __references/nginx/logs/error.log  info;
pid               __references/nginx/logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include            mime.types;   # resolved next to this config file
    default_type       application/octet-stream;

    access_log         __references/nginx/logs/access.log;

    # keep all scratch paths inside the project
    client_body_temp_path  __references/nginx/tmp/client_body;
    proxy_temp_path        __references/nginx/tmp/proxy;
    fastcgi_temp_path      __references/nginx/tmp/fastcgi;
    uwsgi_temp_path        __references/nginx/tmp/uwsgi;
    scgi_temp_path         __references/nginx/tmp/scgi;

    sendfile           on;
    keepalive_timeout  65;

    server {
        listen       8084;
        server_name  localhost;
        root         html;

        client_max_body_size  10m;

        # server-level error pages (mirrors configs/error_page_test.conf)
        error_page 404               /errors/404.html;
        error_page 400 405 411 413 414 /errors/client.html;
        error_page 500 501 502 503 504 505 /errors/server.html;

        location / {
            index      index.html;
            autoindex  on;
        }

        # location-level error page wins over the server-level 404
        location /override {
            error_page 404 /errors/location_404.html;
        }

        # redirections (mirrors configs/redirections.conf)
        location /example { return 301 https://www.example.com; }
        location /test    { return 302 /; }
        location /html    { return 302 /alt_index.html; }
    }
}
